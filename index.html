<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Farmacorp CEDIS - Menú Principal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div id="carouselContainer" class="carousel-fullscreen-container">
        <iframe id="carouselIframe" src="" frameborder="0"></iframe>
        <button id="btnExitCarousel" class="btn-exit-carousel" title="Salir del Carrusel">✕</button>
    </div>

    <div class="bg-interactive" id="bgInteractive">
        <div class="parallax-orb orb-1"></div>
        <div class="parallax-orb orb-2"></div>
        <div class="parallax-orb orb-3"></div>
    </div>

    <header class="navbar">
        <div class="logo-container">
            <img src="img/logo.png" alt="Farmacorp Logo" class="logo-img"
                onerror="this.src='https://via.placeholder.com/150x50?text=Farmacorp'">
            <span class="brand-divider">|</span>
            <span class="brand-sub">CEDIS</span>
        </div>
    </header>

    <main class="menu-container">
        <div class="cards-grid">

            <a href="https://portal-maestro.vercel.app/" class="menu-card">
                <div class="card-slider-wrapper">
                    <div class="slider-track">
                        <img src="img/recep1.jpg" alt="Recepción 1">
                        <img src="img/recep2.jpg" alt="Recepción 2">
                        <img src="img/recep3.jpg" alt="Recepción 3">
                        <img src="img/recep1.jpg" alt="Recepción 1">
                        <img src="img/recep2.jpg" alt="Recepción 2">
                        <img src="img/recep3.jpg" alt="Recepción 3">
                    </div>
                </div>
                <div class="card-overlay"></div>
                <div class="card-info">
                    <h2 class="card-title">Recepción</h2>
                </div>
            </a>

            <a href="https://resilient-bonbon-aa43dd.netlify.app" class="menu-card">
                <div class="card-slider-wrapper">
                    <div class="slider-track">
                        <img src="img/slot1.jpg" alt="Slotting 1">
                        <img src="img/slot2.jpg" alt="Slotting 2">
                        <img src="img/slot3.jpg" alt="Slotting 3">
                        <img src="img/slot1.jpg" alt="Slotting 1">
                        <img src="img/slot2.jpg" alt="Slotting 2">
                        <img src="img/slot3.jpg" alt="Slotting 3">
                    </div>
                </div>
                <div class="card-overlay"></div>
                <div class="card-info">
                    <h2 class="card-title">Slotting</h2>
                </div>
            </a>

            <a href="https://logistica-inversa-nexocorp.web.app/indice.html" class="menu-card">
                <div class="card-slider-wrapper">
                    <div class="slider-track">
                        <img src="img/inver1.jpg" alt="Logística Inversa 1">
                        <img src="img/inver2.jpg" alt="Logística Inversa 2">
                        <img src="img/inver3.jpg" alt="Logística Inversa 3">
                        <img src="img/inver1.jpg" alt="Logística Inversa 1">
                        <img src="img/inver2.jpg" alt="Logística Inversa 2">
                        <img src="img/inver3.jpg" alt="Logística Inversa 3">
                    </div>
                </div>
                <div class="card-overlay"></div>
                <div class="card-info">
                    <h2 class="card-title">Logística Inversa</h2>
                </div>
            </a>

            <a href="https://Studio--qr-weaver-bo1ez.us-central1.hosted.app" class="menu-card">
                <div class="card-slider-wrapper">
                    <div class="slider-track">
                        <img src="img/pick1.jpg" alt="Picking 1">
                        <img src="img/pick2.jpg" alt="Picking 2">
                        <img src="img/pick3.jpg" alt="Picking 3">
                        <img src="img/pick1.jpg" alt="Picking 1">
                        <img src="img/pick2.jpg" alt="Picking 2">
                        <img src="img/pick3.jpg" alt="Picking 3">
                    </div>
                </div>
                <div class="card-overlay"></div>
                <div class="card-info">
                    <h2 class="card-title">Picking</h2>
                </div>
            </a>

        </div>
    </main>

    <button id="btnCarousel" class="btn-carousel-float" title="Carrusel">
        <svg viewBox="0 0 24 24" class="spinner-svg">
            <path
                d="M12 4V1L8 5l4 4V6c3.31 0 6 2.69 6 6 0 1.01-.25 1.97-.7 2.8l1.46 1.46C19.54 15.03 20 13.57 20 12c0-4.42-3.58-8-8-8zm0 14c-3.31 0-6-2.69-6-6 0-1.01.25-1.97.7-2.8L4.24 7.74C3.46 8.97 3 10.43 3 12c0 4.42 3.58 8 8 8v3l4-4-4-4v3z" />
        </svg>
    </button>

    <script src="script.js"></script>
</body>

</html>
