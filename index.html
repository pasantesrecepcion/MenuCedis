<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Farmacorp CEDIS - Menú Principal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="bg-interactive" id="bgInteractive">
        <div class="parallax-orb orb-1"></div>
        <div class="parallax-orb orb-2"></div>
        <div class="parallax-orb orb-3"></div>
    </div>

    <header class="navbar">
        <div class="logo-container">
            <img src="img/logo.png" alt="Farmacorp Logo" class="logo-img"
                onerror="this.src='https://via.placeholder.com/150x50?text=Farmacorp'">
            <span class="brand-divider">|</span>
            <span class="brand-sub">CEDIS</span>
        </div>
    </header>

    <main class="menu-container">
        <div class="cards-grid">

            <a href="https://portal-maestro.vercel.app/" class="menu-card">
                <div class="card-slider-wrapper">
                    <div class="slider-track">
                        <img src="img/recep1.jpg" alt="Recepción 1">
                        <img src="img/recep2.jpg" alt="Recepción 2">
                        <img src="img/recep3.jpg" alt="Recepción 3">
                        <img src="img/recep1.jpg" alt="Recepción 1">
                        <img src="img/recep2.jpg" alt="Recepción 2">
                        <img src="img/recep3.jpg" alt="Recepción 3">
                    </div>
                </div>
                <div class="card-overlay"></div>
                <div class="card-info">
                    <h2 class="card-title">Recepción</h2>
                </div>
            </a>

            <a href="https://resilient-bonbon-aa43dd.netlify.app" class="menu-card">
                <div class="card-slider-wrapper">
                    <div class="slider-track">
                        <img src="img/slot1.jpg" alt="Slotting 1">
                        <img src="img/slot2.jpg" alt="Slotting 2">
                        <img src="img/slot3.jpg" alt="Slotting 3">
                        <img src="img/slot1.jpg" alt="Slotting 1">
                        <img src="img/slot2.jpg" alt="Slotting 2">
                        <img src="img/slot3.jpg" alt="Slotting 3">
                    </div>
                </div>
                <div class="card-overlay"></div>
                <div class="card-info">
                    <h2 class="card-title">Slotting</h2>
                </div>
            </a>

            <a href="https://logistica-inversa-nexocorp.web.app/indice.html" class="menu-card">
                <div class="card-slider-wrapper">
                    <div class="slider-track">
                        <img src="img/inver1.jpg" alt="Logística Inversa 1">
                        <img src="img/inver2.jpg" alt="Logística Inversa 2">
                        <img src="img/inver3.jpg" alt="Logística Inversa 3">
                        <img src="img/inver1.jpg" alt="Logística Inversa 1">
                        <img src="img/inver2.jpg" alt="Logística Inversa 2">
                        <img src="img/inver3.jpg" alt="Logística Inversa 3">
                    </div>
                </div>
                <div class="card-overlay"></div>
                <div class="card-info">
                    <h2 class="card-title">Logística Inversa</h2>
                </div>
            </a>

        </div>
    </main>

    <script src="script.js"></script>
</body>

</html>
