<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Farmacorp CEDIS - Menú Principal</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="bg-interactive" id="bgInteractive"></div>

    <header class="navbar">
        <div class="logo-container">
            <img src="logo.png" alt="Farmacorp Logo" class="logo-img"
                onerror="this.src='https://via.placeholder.com/150x50?text=Farmacorp'">
            <span class="brand-divider">|</span>
            <span class="brand-sub">CEDIS</span>
        </div>
    </header>

    <main class="menu-container">
        <div class="cards-grid">

            <a href="#" class="menu-card">
                <div class="card-image-wrapper">
                    <div class="image-slide"
                        style="background-image: url('https://images.unsplash.com/photo-1601584115197-04ecc0da31d7?auto=format&fit=crop&q=80&w=600');">
                    </div>
                </div>
                <div class="card-info">
                    <span class="card-icon">📥</span>
                    <h2 class="card-title">Recepción</h2>
                </div>
            </a>

            <a href="#" class="menu-card">
                <div class="card-image-wrapper">
                    <div class="image-slide"
                        style="background-image: url('https://images.unsplash.com/photo-1586528116311-ad8dd3c8310d?auto=format&fit=crop&q=80&w=600');">
                    </div>
                </div>
                <div class="card-info">
                    <span class="card-icon">📦</span>
                    <h2 class="card-title">Slotting</h2>
                </div>
            </a>

            <a href="#" class="menu-card">
                <div class="card-image-wrapper">
                    <div class="image-slide"
                        style="background-image: url('https://images.unsplash.com/photo-1563986768609-322da13575f3?auto=format&fit=crop&q=80&w=600');">
                    </div>
                </div>
                <div class="card-info">
                    <span class="card-icon">🔄</span>
                    <h2 class="card-title">Logística Inversa</h2>
                </div>
            </a>

        </div>
    </main>

    <script src="script.js"></script>
</body>

</html>
